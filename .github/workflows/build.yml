# Tests and packages BASidekick Building Sim on macOS, Windows and Linux.
# Every run uploads the packages as artifacts; a v* tag also attaches them
# to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: scripts/build-mac.sh --universal
          - os: windows-latest
            package: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1
          # the oldest supported Ubuntu, so the binaries run on older glibc too
          - os: ubuntu-22.04
            package: scripts/build-linux.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libasound2-dev
      - name: Test
        run: cargo test --workspace --locked
      - name: Package
        shell: bash
        run: ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: basidekick-sim-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
