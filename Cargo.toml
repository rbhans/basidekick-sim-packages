[workspace]
resolver = "3"
members = ["crates/points", "crates/bacnet", "crates/engine", "crates/runner", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["BASidekick"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rbhans/basidekick-sim-packages"

[workspace.dependencies]
bask-points = { path = "crates/points" }
bask-bacnet = { path = "crates/bacnet" }
bask-sim = { path = "crates/engine" }
bask-runner = { path = "crates/runner" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
anyhow = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = false
