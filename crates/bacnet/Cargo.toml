[package]
name = "bask-bacnet"
version.workspace = true
edition.workspace = true
description = "BACnet/IP server with a virtual routed network, serving a bask-points database"

[dependencies]
bask-points.workspace = true
parking_lot.workspace = true
socket2 = { version = "0.6", features = ["all"] }

# Interface listing and local time.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
if-addrs = "0.15"
chrono.workspace = true
