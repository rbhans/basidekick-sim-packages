description = "Condensing boiler and hot water pump"
mbh = 900

[[equipment]]
type = "ahu"
id = "AHU-1"
description = "Air handler, classrooms, library and office"
supply_cfm = 12000
cooling = "chw"
heating = "hw"
chw_plant = "CH-1"
hw_plant = "B-1"
min_oa_pct = 40

