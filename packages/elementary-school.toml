id = "LTG-1"
description = "Lighting relay panel"
zones = ["class-101", "class-102", "class-103", "class-104", "class-105", "class-106", "class-107", "class-108", "library", "office", "gym", "cafeteria"]

[[equipment]]
type = "meter"
id = "EM-1"
description = "Main electric meter"

[[scenario]]
id = "assembly"
name = "All-school assembly"
category = "occupancy"
description = "The whole school files into the gym for an hour. Classrooms empty out; RTU-GYM fights 300 people and CO2 soars."
duration_min = 60
ramp_min = 10
effects = [
    { kind = "people", factor = 6.0, zones = ["gym"] },
    { kind = "people", factor = 0.1, zones = ["class-101", "class-102", "class-103", "class-104", "class-105", "class-106", "class-107", "class-108"] },
]

[[scenario]]
id = "lunch-rush"
name = "Lunch rush"
category = "occupancy"
description = "Three lunch waves pack the cafeteria for 45 minutes while the kitchen runs hot."
duration_min = 45
ramp_min = 5
effects = [
    { kind = "people", factor = 4.0, zones = ["cafeteria"] },
    { kind = "heat_gain", zone = "cafeteria", btuh = 40000 },
]

[[scenario]]
id = "pta-night"
name = "PTA night"
category = "occupancy"
description = "An evening event in the library and the gym: the building runs occupied for three hours after hours."
duration_min = 180
effects = [
    { kind = "force_occupied" },
    { kind = "people", floor = 0.6, zones = ["library", "gym"] },
]

[[scenario]]
id = "chiller-trip"
name = "Chiller trips"
category = "equipment"
description = "CH-1 trips on low refrigerant pressure. CHWS climbs, AHU-1's valve goes wide open, supply air and classrooms warm."
effects = [{ kind = "fail", equip = "CH-1", part = "cooling" }]

[[scenario]]
id = "boiler-lockout"
name = "Boiler flame failure"
category = "equipment"
description = "B-1 locks out. HWS sags, reheat valves open wide for nothing and perimeter classrooms cool."
effects = [{ kind = "fail", equip = "B-1", part = "heating" }]

[[scenario]]
id = "hw-pump"
name = "Hot water pump fails"
category = "equipment"
description = "HWP-C on, HWP-S off. With no flow the boiler can't prove and every reheat coil goes cold."
effects = [{ kind = "fail", equip = "B-1", part = "fan" }]

[[scenario]]
id = "ahu1-fan"
name = "AHU-1 supply fan VFD faults"
category = "equipment"
description = "The drive faults. Static falls to zero, every VAV box drives its damper wide open hunting for air, ten zones drift."
effects = [{ kind = "fail", equip = "AHU-1", part = "fan" }]

[[scenario]]
id = "ahu1-oa-stuck"
name = "AHU-1 outside air damper stuck open"
category = "equipment"
description = "Damper at 100 % whatever the command. On a cold day mixed air plunges and the freezestat trips the unit."
effects = [{ kind = "stuck", equip = "AHU-1", actuator = "oa_damper", position = 100 }]

[[scenario]]
id = "vav103-damper"
name = "VAV-103 damper stuck at 10 %"
category = "equipment"
description = "The actuator dies. Airflow falls well short of setpoint, Classroom 103 overheats while the box asks for more."
effects = [{ kind = "stuck", equip = "VAV-103", actuator = "damper", position = 10 }]

[[scenario]]
id = "vav106-drift"
name = "VAV-106 sensor drifts high"
category = "equipment"
description = "Room 106's sensor drifts to read 5 °F high over two hours. The box over-cools a room that's actually cold. No fault flag."
ramp_min = 120
effects = [{ kind = "sensor", equip = "VAV-106", point = "ZN-T", mode = "offset", value = 5.0 }]

[[scenario]]
id = "vav-offline"
name = "Classroom wing goes offline"
category = "network"
description = "A failed MS/TP repeater takes VAV-101 to VAV-104 off the network for 20 minutes."
duration_min = 20
effects = [
    { kind = "offline", equip = "VAV-101" },
    { kind = "offline", equip = "VAV-102" },
    { kind = "offline", equip = "VAV-103" },
    { kind = "offline", equip = "VAV-104" },
]
