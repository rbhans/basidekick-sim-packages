# Elementary School: classrooms on a VAV air handler with a chiller and a
# boiler, plus rooftop units for the gym and cafeteria.

id = "elementary-school"
name = "Elementary School"
tagline = "Chiller + boiler · AHU with 10 VAVs · gym & cafeteria RTUs"
description = """
A 22,000 sq ft elementary school. Eight classrooms, the library and the \
front office sit on a VAV air handler with chilled-water cooling and \
hot-water reheat from a central chiller and boiler. The gym and the \
cafeteria have their own rooftop units, and a kitchen hood fan runs with \
the cafeteria unit. Classroom boxes carry CO2 sensors."""
icon = "school"
area_sqft = 22000
location = "Naperville, IL"
network = 2002
site_instance = 2000

[schedule]
weekday = ["07:30", "16:00"]
hvac_lead_min = 90
profile = "school"

