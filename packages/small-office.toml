# Small Office: a single-story, 5,000 sq ft office on four packaged rooftop
# units. The quickest building to get your head around.

id = "small-office"
name = "Small Office"
tagline = "Single-story office · 4 RTUs · lighting panel · meter"
description = """
A 5,000 sq ft single-story office. Each space has its own packaged rooftop \
unit with two stages of DX cooling, gas heat and an economizer. One lighting \
panel, one restroom exhaust fan and a main electric meter round it out."""
icon = "building"
area_sqft = 5000
location = "Columbus, OH"
network = 2001
site_instance = 1000

[schedule]
weekday = ["07:30", "18:00"]
saturday = ["09:00", "12:00"]
hvac_lead_min = 60
profile = "office"

[[zone]]
id = "open-office"
name = "Open Office"
area_sqft = 2400
people = 18
exposure = 0.7
facing = "south"

[[zone]]
id = "private-offices"
name = "Private Offices"
area_sqft = 1100
people = 6
exposure = 0.8
facing = "east"

[[zone]]
id = "conference"
name = "Conference Room"
area_sqft = 450
people = 6
exposure = 0.6
facing = "west"

[[zone]]
id = "lobby"
name = "Lobby & Break Room"
area_sqft = 1050
people = 3
exposure = 0.5
facing = "north"
door_cfm = 900
process_btuh = 2500

[[equipment]]
type = "rtu"
id = "RTU-1"
description = "Rooftop unit, open office"
zone = "open-office"
supply_cfm = 3000
cool_tons = 7.5
heat_mbh = 120

[[equipment]]
type = "rtu"
id = "RTU-2"
description = "Rooftop unit, private offices"
zone = "private-offices"
supply_cfm = 1400
cool_tons = 4
heat_mbh = 80

[[equipment]]
type = "rtu"
id = "RTU-3"
description = "Rooftop unit, conference room"
zone = "conference"
supply_cfm = 700
cool_tons = 2
cool_stages = 1
heat_mbh = 40
heat_stages = 1

[[equipment]]
type = "rtu"
id = "RTU-4"
description = "Rooftop unit, lobby and break room"
zone = "lobby"
supply_cfm = 1200
cool_tons = 3
heat_mbh = 60

[[equipment]]
type = "exhaust_fan"
id = "EF-1"
description = "Restroom exhaust fan"
cfm = 450

[[equipment]]
type = "lighting"
id = "LTG-1"
description = "Lighting relay panel"
zones = ["open-office", "private-offices", "conference", "lobby"]

[[equipment]]
type = "meter"
id = "EM-1"
description = "Main electric meter"

[[scenario]]
id = "all-hands"
name = "All-hands in the conference room"
category = "occupancy"
description = "Twenty people cram into a room built for six for 90 minutes. RTU-3 runs flat out, CO2 climbs past 1,500 ppm."
duration_min = 90
ramp_min = 10
effects = [{ kind = "people", factor = 3.5, floor = 0.9, zones = ["conference"] }]

[[scenario]]
id = "front-door-propped"
name = "Front door propped open"
category = "occupancy"
description = "Someone wedges the front door for a delivery. Outside air pours into the lobby for an hour."
duration_min = 60
effects = [{ kind = "door_open", zone = "lobby", cfm = 1200 }]

[[scenario]]
id = "rtu1-fan-belt"
name = "RTU-1 fan belt snaps"
category = "equipment"
description = "SF-C stays on, SF-S drops, SF-FAIL alarms after 30 s. The open office drifts and CO2 builds with no ventilation."
effects = [{ kind = "fail", equip = "RTU-1", part = "fan" }]

[[scenario]]
id = "rtu2-compressor"
name = "RTU-2 compressor lockout"
category = "equipment"
description = "High head pressure lockout on RTU-2. The stages are called, the supply air stays warm, the private offices climb."
effects = [{ kind = "fail", equip = "RTU-2", part = "cooling" }]

[[scenario]]
id = "rtu1-damper-stuck"
name = "RTU-1 economizer stuck open"
category = "equipment"
description = "The economizer linkage slips and the outside air damper sits at 100 %. Harmless on a mild day; costly on a hot or cold one."
effects = [{ kind = "stuck", equip = "RTU-1", actuator = "oa_damper", position = 100 }]

[[scenario]]
id = "lobby-sensor-fail"
name = "Lobby space sensor fails"
category = "equipment"
description = "RTU-4's zone sensor opens: reads -40 °F with a fault, and RTU-4 heats the lobby as hard as it can."
effects = [{ kind = "sensor", equip = "RTU-4", point = "ZN-T", mode = "fail" }]

[[scenario]]
id = "rtu3-offline"
name = "RTU-3 controller drops offline"
category = "network"
description = "RTU-3 stops answering BACnet for 30 minutes. It keeps running on its own logic."
duration_min = 30
effects = [{ kind = "offline", equip = "RTU-3" }]

# Lessons: the Lessons tab sets each one up and walks through it.

[[lesson]]
id = "rtu-basics"
title = "Read a rooftop unit"
level = "Beginner"
goal = "Learn what a packaged rooftop unit's points tell you on a normal summer morning."
setup = { season = "summer", time = "10:00", speed = 1, device = "RTU-1", chart = "Zone temperature" }
steps = [
    "Discover devices from your BAS. The site controller, device 1000, routes to network 2001 where the four rooftop units live.",
    "Open RTU-1. Compare `ZN-T` with `EFF-CLG-SP` and `EFF-HTG-SP`.",
    "Read `CLG-DMD`, then the stage commands `CLG1-C` and `CLG2-C`, and `UNIT-MODE`.",
    "Watch `SA-T` on the Air temperatures chart as a stage comes on and off.",
]
expect = "The cooling demand rises as the room warms past its setpoint, and the stages follow it. Supply air drops 15 to 20 °F within a few minutes of a stage starting and drifts back when it stops. The room rides within a degree of its cooling setpoint."

[[lesson]]
id = "short-cycling"
title = "Short cycling"
level = "Intermediate"
goal = "See what the minimum on and off times protect a compressor from."
setup = { season = "summer", time = "14:00", speed = 10, device = "RTU-3", chart = "Air temperatures" }
steps = [
    "RTU-3 is oversized for the conference room. Read `CMP-STARTS` (starts in the last hour).",
    "Write `CMP-MIN-ON` = 0, `CMP-MIN-OFF` = 0 and `CLG-KP` = 200.",
    "Watch an hour of sim time: `CLG1-C`, `SA-T` and `CMP-STARTS`.",
    "Put them back to 180, 300 and 40.",
]
expect = "Runs shrink to about three minutes, supply air swings 20 to 30 °F, and starts climb from about 3 an hour toward 6. Every start is wear on the compressor. The timers trade a little temperature swing for a lot of compressor life."

[[lesson]]
id = "economizer-stuck"
title = "Economizer stuck open"
level = "Intermediate"
goal = "Find a stuck damper from temperatures that don't add up."
setup = { season = "winter", time = "10:00", speed = 10, scenarios = ["rtu1-damper-stuck"], device = "RTU-1", chart = "Air temperatures" }
steps = [
    "Read `OAD-O` on RTU-1. What position is the damper commanded to?",
    "Now compare `MA-T` with `RA-T` and `OA-T`. Where would mixed air sit at that command?",
    "Look at RTU-1's heating stages, its `SA-T` and its `ZN-T`, against RTU-2's.",
]
expect = "The command says minimum outside air, but mixed air sits right at the outdoor temperature: the damper is wide open whatever it's told. RTU-1 heats flat out and still loses ground, and the open office slides below its heating setpoint. The check is mixed air: it should sit between outdoor and return, in proportion to the damper command."

[[lesson]]
id = "dcv-rtu"
title = "Ventilation on demand"
level = "Beginner"
goal = "See a rooftop unit's outside air follow the room's CO2."
setup = { season = "mild", time = "07:30", speed = 10, device = "RTU-1", chart = "CO2" }
steps = [
    "Before people arrive, read `ZN-CO2`, `EFF-MIN-OA`, `AREA-MIN-OA` and `MIN-OA` on RTU-1.",
    "Watch the morning: CO2 climbs as people arrive, and `EFF-MIN-OA` follows it up.",
    "Write `DCV` = Disabled at priority 8 and watch `EFF-MIN-OA` jump to `MIN-OA`.",
]
expect = "With few people in, RTU-1 brings in only its empty-room minimum of outside air. As CO2 climbs past 600 ppm the minimum ramps up, reaching the full `MIN-OA` at 900 ppm (`CO2-SP`). With DCV off it takes the full minimum all day, and on a hot or cold day it pays to condition all that outside air."
